[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcbeamtrack"
version = "0.1.0"
description = "2.5D DC electron beam tracking with transverse space charge"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "duoxup" }]
dependencies = [
  "numpy",
  "scipy",
  "numba",
  "partdist",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "black"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["dcbeamtrack*"]

[tool.ruff]
line-length = 100
